framework:
    messenger:
        failure_transport: failed_notifications
        transports:
            async_notifications:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: notifications
                    auto_setup: false
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
                    jitter: 0.1
            failed_notifications: 'doctrine://default?queue_name=failed_notifications&auto_setup=0'

        routing:
            App\Message\Notification\IncidentTransitionNotification: async_notifications

when@test:
    framework:
        messenger:
            failure_transport: failed_notifications
            transports:
                async_notifications: 'in-memory://'
                failed_notifications: 'in-memory://'
