dh_auditor:
    enabled: true
    timezone: UTC
    user_provider: App\Service\Audit\AuditUserProvider
    providers:
        doctrine:
            table_prefix: audit_
            table_suffix: ''
            ignored_columns:
                - createdAt
                - updatedAt
            entities:
                App\Entity\User\User:
                    ignored_columns:
                        - password
                        - technicalRoles
                App\Entity\Rbac\Role: ~
                App\Entity\Rbac\Permission: ~
                App\Entity\Node\Node: ~
                App\Entity\NodeGroup\NodeGroup: ~
                App\Entity\Monitoring\MonitoringTemplate: ~
                App\Entity\Monitoring\ItemDefinition: ~
                App\Entity\Maintenance\MaintenanceWindow: ~
                App\Entity\Incident\Incident: ~
                App\Entity\Incident\IncidentActivity: ~
                App\Entity\Agent\Agent: ~
                App\Entity\Agent\AgentCredential:
                    ignored_columns:
                        - secretHash
                App\Entity\Enrollment\EnrollmentToken:
                    ignored_columns:
                        - tokenHash
            storage_services:
                - '@doctrine.orm.default_entity_manager'
            auditing_services:
                - '@doctrine.orm.default_entity_manager'
            viewer: false
