doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            User:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/User/Domain/Entity'
                prefix: 'App\User\Domain\Entity'
                alias: User
            Rbac:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Rbac/Domain/Entity'
                prefix: 'App\Rbac\Domain\Entity'
                alias: Rbac
            Node:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Node/Domain/Entity'
                prefix: 'App\Node\Domain\Entity'
                alias: Node
            NodeGroup:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/NodeGroup/Domain/Entity'
                prefix: 'App\NodeGroup\Domain\Entity'
                alias: NodeGroup
            Enrollment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Enrollment/Domain/Entity'
                prefix: 'App\Enrollment\Domain\Entity'
                alias: Enrollment
            Agent:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Agent/Domain/Entity'
                prefix: 'App\Agent\Domain\Entity'
                alias: Agent

when@test:
    doctrine:
        dbal:
            url: '%env(resolve:DATABASE_TEST_URL)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
