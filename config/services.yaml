# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    osira.enrollment_token_ttl: 900
    osira.victoriametrics_url: '%env(VICTORIAMETRICS_URL)%'
    osira.victoriametrics_timeout: '%env(float:VICTORIAMETRICS_TIMEOUT)%'
    osira.alert_evaluation_interval: '%env(int:ALERT_EVALUATION_INTERVAL_SECONDS)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\Enrollment\EnrollmentTokenIssuer:
        arguments:
            $ttlSeconds: '%osira.enrollment_token_ttl%'

    App\Security\Auth\TokenHasher:
        arguments:
            $pepper: '%kernel.secret%'

    App\Service\Metrics\VictoriaMetricsClientInterface:
        alias: App\Service\Metrics\VictoriaMetricsClientProxy

    App\Service\Metrics\VictoriaMetricsClientProxy:
        arguments:
            $inner: '@App\Service\Metrics\VictoriaMetricsHttpClient'

    App\Service\Metrics\VictoriaMetricsHttpClient:
        arguments:
            $httpClient: '@http_client'
            $baseUrl: '%osira.victoriametrics_url%'
            $timeoutSeconds: '%osira.victoriametrics_timeout%'

    App\Scheduler\Alert\AlertSchedule:
        arguments:
            $intervalSeconds: '%osira.alert_evaluation_interval%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        logger:
            class: Symfony\Component\HttpKernel\Log\Logger
            arguments:
                $minLevel: debug
                $output: 'php://memory'
                $requestStack: '@request_stack'
                $debug: '%kernel.debug%'
