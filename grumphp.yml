grumphp:
    process_timeout: 180
    stop_on_failure: false
    parallel:
        enabled: true
        max_workers: 8
    fixer:
        enabled: false
    tasks:
        composer:
            no_check_publish: true
            no_local_repository: true
            strict: true
        composer_normalize:
            indent_size: 4
            indent_style: space
            no_check_lock: false
        composer_script:
            script: architecture
            triggered_by:
                - php
        git_blacklist:
            keywords:
                - "\\bdd\\s*\\("
                - "\\bdump\\s*\\("
                - "\\bvar_dump\\s*\\("
                - "\\bdie\\s*\\("
            triggered_by:
                - php
            regexp_type: E
        git_branch_name:
            whitelist:
                - /^(main|develop)$/
                - /^(build|chore|ci|docs|feat|fix|perf|refactor|release|style|test)\/[a-z0-9][a-z0-9._-]*$/
            allow_detached_head: true
        git_commit_message:
            enforce_capitalized_subject: false
            enforce_no_subject_trailing_period: true
            enforce_single_lined_subject: true
            max_body_width: 100
            max_subject_width: 100
            type_scope_conventions:
                types:
                    - build
                    - chore
                    - ci
                    - docs
                    - feat
                    - fix
                    - perf
                    - refactor
                    - revert
                    - style
                    - test
        jsonlint:
            detect_key_conflicts: true
        phpcsfixer:
            allow_risky: true
            config: .php-cs-fixer.dist.php
            config_contains_finder: true
            diff: true
        phplint:
            exclude:
                - vendor
                - var
        phpstan:
            configuration: phpstan.neon
            memory_limit: 512M
            use_grumphp_paths: false
        phpunit:
            always_execute: true
            config_file: phpunit.xml.dist
        securitychecker_composeraudit:
            abandoned: fail
            locked: true
            no_dev: false
            run_always: true
        yamllint: ~
    testsuites:
        ci:
            tasks:
                - composer
                - composer_normalize
                - composer_script
                - jsonlint
                - phpcsfixer
                - phplint
                - phpstan
                - phpunit
                - securitychecker_composeraudit
                - yamllint
        git_pre_commit:
            tasks:
                - composer
                - composer_normalize
                - composer_script
                - git_blacklist
                - git_branch_name
                - jsonlint
                - phpcsfixer
                - phplint
                - phpstan
                - phpunit
                - securitychecker_composeraudit
                - yamllint
        git_commit_msg:
            tasks:
                - git_commit_message
