name: Feature request
description: Suggest an improvement or a new capability for Osira API.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for proposing an improvement. Explain the problem before describing a solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, or workflow you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other designs you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, related projects, or compatibility considerations.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request covering this use case.
          required: true
        - label: I am willing to help implement or test this feature.
          required: false
