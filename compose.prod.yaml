services:
  app:
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set for production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-osira}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}@database:5432/${POSTGRES_DB:-osira}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE must be set for production}
      SERVER_NAME: ${SERVER_NAME:-:80}
      FRANKENPHP_CONFIG: worker /app/public/index.php
    command: >-
      sh -c 'php bin/console cache:clear --no-debug
      && exec frankenphp run --config /etc/frankenphp/Caddyfile'
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
